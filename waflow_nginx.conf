server {
    server_name waflow.devicedoctorindia.com;
    client_max_body_size 300M;

        # 1. Serve the Frontend (React/Vite) UI
    location / {
        root /home/azureuser/convoreach/Frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy API requests to the NestJS Backend
    location /api/ {
        proxy_pass http://localhost:2785;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # 3. Proxy and Rewrite /openwa-api/ to the Backend's /api/
    location /openwa-api/ {
        rewrite ^/openwa-api/(.*)$ /api/$1 break;
        proxy_pass http://localhost:2785;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/waflow.devicedoctorindia.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/waflow.devicedoctorindia.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = waflow.devicedoctorindia.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name waflow.devicedoctorindia.com;
    client_max_body_size 300M;
    return 404; # managed by Certbot

}
